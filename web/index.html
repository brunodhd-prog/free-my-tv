<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="hero" class="layer">
    <div class="himg"></div>
    <div class="himg"></div>
    <div class="hshade"></div>
    <div id="htext"><div class="ht"></div><div class="hm"></div><div class="ho"></div></div>
  </div>
  <div id="home" class="layer">
    <div id="page">
      <div id="shelflabel" class="rlabel"></div>
      <div id="platter"></div>
      <div id="tiles"></div>
      <div id="rows"></div>
    </div>
    <div id="top" class="layer">
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="mini"><span class="mwx"></span><span class="mtime"></span></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
